name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (torch CPU отдельным колесом, чтобы не тянуть CUDA)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Кэш модели TimesFM 2.5 (925 МБ в ~/.cache/huggingface)
        uses: actions/cache@v4
        id: hfmodel
        with:
          path: ~/.cache/huggingface
          key: hf-ubuntu-timesfm-2.5-200m-1d95242
          restore-keys: |
            hf-ubuntu-timesfm-2.5-200m-

      - name: Быстрые тесты (модель не нужна)
        run: python -m pytest -m "not slow" -q

      - name: Smoke реальной модели TimesFM 2.5
        run: python -m pytest -m slow -q

      - name: Отчёт по кэшу модели
        if: always()
        run: |
          {
            echo "### Кэш модели TimesFM 2.5"
            echo ""
            echo "| что | значение |"
            echo "|---|---|"
            echo "| cache-hit | ${{ steps.hfmodel.outputs.cache-hit }} |"
            echo "| ревизия | 1d952420fba8 |"
          } >> "$GITHUB_STEP_SUMMARY"
